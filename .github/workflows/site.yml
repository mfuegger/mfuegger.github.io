name: Build and publish academic website

on:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:17 UTC; refresh the institutional bibliography.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh from the institutional bibliography
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: academic-website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install bibliography tools
        run: python -m pip install -r scripts/requirements.txt
      - name: Build from editable source files
        env:
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_REQUESTED: ${{ inputs.refresh }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python scripts/build_site.py --refresh-if-enabled
          elif [ "$REFRESH_REQUESTED" = "true" ]; then
            python scripts/build_site.py --refresh
          else
            python scripts/build_site.py
          fi
          python scripts/check_site.py
      - name: Save bibliography refresh when changed
        run: |
          git add content/publications.bib content/bibliography-status.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh source bibliography'
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
