<a class="video-preview" href="$url" aria-label="$accessible_label">
  <img src="$thumbnail" width="$width" height="$height" alt="" loading="lazy" decoding="async" />
  <span class="video-preview-caption">
    <strong>$heading</strong>
    $description
    <span class="video-preview-action">▶ $watch_label</span>
  </span>
</a>
