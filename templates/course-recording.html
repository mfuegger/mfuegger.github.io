<a class="course-recording" href="$url" aria-label="$accessible_label">
  <img src="$thumbnail" width="$width" height="$height" alt="" loading="lazy" decoding="async" />
  <span class="course-recording-caption">
    <strong>$course_name · $year</strong>
    <span>$title</span>
    <span class="course-recording-action">▶ $watch_label</span>
  </span>
</a>
