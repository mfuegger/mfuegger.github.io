<!doctype html>
<!-- Generated page. Edit content/notices.json and content/profile.json, then rebuild. -->
<html lang="en">
  $head
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="wrap">
      $header
      <main id="main" class="notice-page">
        <div class="page-intro">
          <h1>$title</h1>
          <p>$intro</p>
          <p class="subtle">Last reviewed: $last_reviewed</p>
        </div>
        <section class="section" aria-labelledby="contact-title">
          <h2 class="section-title" id="contact-title">$contact_heading</h2>
          <address>$name<br />$address<br />$email</address>
        </section>
        $sections
      </main>
      $footer
    </div>
  </body>
</html>
